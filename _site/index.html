<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>zal-go</title>
    <link rel="stylesheet" href="index.css">
    <script src="assets/wasm_exec.js"></script>
  </head>
  <body>
    <h1 class="corruptable"><code class="plain">zal-go</code><code class="corrupt">ẕ̋͟͜a̸̠͙͢l̫͕͖̍-̥̣̆͢g͓̋̀͋̇ȏ̞͠</code></h1>
    <p>
      Type your text in the input below, then click the <em>Corrupt</em> button to
      generate a corrupted version of the text.
    </p>
    <form id="zalgo-form">
      <textarea id="zalgo-input" rows="5" cols="80"></textarea>
      <button type="submit" class="corruptable"><span class="plain">Corrupt</span><span class="corrupt">C̸̛̪͙̑o͔̩̽̏̕͠r̵͚̫̰̓̍͟͜r̲̱̩̝̀̇͢͞u͍̺̘̩͖̫̔̔͜p̡̭̠̪̉̔t̡̧̨̓̐̾</span></button>
    </form>
    <output id="zalgo-output"></output>
    <script type="module">
      const form = document.getElementById("zalgo-form");
      const input = document.getElementById("zalgo-input");
      const output = document.getElementById("zalgo-output");
      const go = new Go();
      let { module, instance } = await WebAssembly
        .instantiateStreaming(fetch("assets/main.wasm"), go.importObject);
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        go.run(instance);
        instance = await WebAssembly.instantiate(module, go.importObject);
      });
    </script>
    <footer>
      <ul>
        <li>
          <a href="assets/LICENSE-wasm_exec"><code>wasm_exec.js</code> license</a>
        </li>
      </ul>
    </footer>
  </body>
</html>
