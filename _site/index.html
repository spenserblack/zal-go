<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>zal-go</title>
    <link rel="stylesheet" href="index.css">
    <script src="assets/wasm_exec.js"></script>
  </head>
  <body>
    <h1 class="corruptable"><code class="plain">zal-go</code><code class="corrupt">ẕ̋͟͜a̸̠͙͢l̫͕͖̍-̥̣̆͢g͓̋̀͋̇ȏ̞͠</code></h1>
    <p>
      Type your text in the input below, then click the <em>Corrupt</em> button to
      generate a corrupted version of the text.
    </p>
    <p>
      <em>Minimum corruption cannot be greater than maximum corruption.</em>
    </p>
    <form id="zalgo-form">
      <div class="form-group">
        <label for="zalgo-input">Input</label>
        <div class="form-input">
          <textarea id="zalgo-input" rows="5" cols="80"></textarea>
        </div>
      </div>
      <div class="form-group">
        <label for="minimum-corruption">Minimum corruption</label>
        <div class="form-input">
          <input type="number" id="minimum-corruption" min="0" value="5">
        </div>
      </div>
      <div class="form-group">
        <label for="maximum-corruption">Maximum corruption</label>
        <div class="form-input">
          <input type="number" id="maximum-corruption" min="0" value="10">
        </div>
      </div>
      <button type="submit" id="submit-button" class="corruptable"><span class="plain">Corrupt</span><span class="corrupt">C̸̛̪͙̑o͔̩̽̏̕͠r̵͚̫̰̓̍͟͜r̲̱̩̝̀̇͢͞u͍̺̘̩͖̫̔̔͜p̡̭̠̪̉̔t̡̧̨̓̐̾</span></button>
    </form>
    <output id="zalgo-output"></output>
    <script type="module">
      const form = document.getElementById("zalgo-form");
      const input = document.getElementById("zalgo-input");
      const output = document.getElementById("zalgo-output");
      const minInput = document.getElementById("minimum-corruption");
      const maxInput = document.getElementById("maximum-corruption");
      const submit = document.getElementById("submit-button");

      const validateForm = () => {
        const [min, max] = [minInput, maxInput].map((el) => Number.parseInt(el.value, 10));
        const valid = !!input.value && min <= max;
        if (valid) {
          submit.removeAttribute("disabled");
        } else {
          submit.setAttribute("disabled", "disabled");
        }
      };
      [minInput, maxInput, input].forEach((el) => {
        el.addEventListener("input", validateForm);
      });
      validateForm();

      const go = new Go();
      let { module, instance } = await WebAssembly
        .instantiateStreaming(fetch("assets/main.wasm"), go.importObject);
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        go.run(instance);
        instance = await WebAssembly.instantiate(module, go.importObject);
      });
    </script>
    <footer>
      <ul>
        <li>
          <a href="https://github.com/spenserblack/zal-go">Source code</a>
        </li>
        <li>
          <a href="assets/LICENSE-wasm_exec"><code>wasm_exec.js</code> license</a>
        </li>
        <li>
          Site looks bad? <a href="https://github.com/spenserblack/zal-go/issues/9">Make it look less bad!</a>
        </li>
      </ul>
    </footer>
  </body>
</html>
